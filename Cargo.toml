[package]
name = "samsung-tv-adspoofer"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15", default-features = false }
minijinja = { version = "3.0.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite = "0.37"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4"] }
