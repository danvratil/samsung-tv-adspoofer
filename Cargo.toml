[package]
name = "samsung-tv-adspoofer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum_typed_multipart = "0.17.0"
clap = { version = "4.6.7", features = ["derive"] }
config = { version = "0.15", default-features = false }
futures-util = "0.3.34"
image = "0.25.10"
minijinja = { version = "3.0.5", features = ["serde"] }
rand = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlite = "0.37"
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["fs", "io-util", "process", "rt", "rt-multi-thread"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4"] }
