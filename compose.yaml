services:
  adspoofer:
    build: .
    restart: unless-stopped
    command:
      - --listen
      - 0.0.0.0:8080
      - --database
      - /data/database.sqlite
      - --storage
      - /data/files
      - --base-url
      - ${BASE_URL:-http://192.168.0.2:8080}
    volumes:
      - data:/data

  nginx:
    image: nginx:stable-bookworm
    restart: unless-stopped
    depends_on:
      - adspoofer
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  data:
